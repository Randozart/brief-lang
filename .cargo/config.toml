# 2026-06-27: Set 8MB stack for debug builds to prevent stack overflow on
# large projects (e.g., officina-cli with 14 modules + complex expression ASTs).
# Debug builds have ~4x larger stack frames than release builds (debug info, no
# inlining), and the default 2MB stack is insufficient for the cumulative depth
# of the compilation pipeline. 8MB matches the Linux default `ulimit -s` and
# gives headroom for any project without changing the compiler's architecture.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-args=-Wl,-z,stack-size=8388608"]
