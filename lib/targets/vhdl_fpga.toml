[target]
name = "vhdl-fpga"
backend = "vhdl"
capabilities = ["logic", "hardware_triggers", "mmio"]

[codegen]
extension = "vhd"
state_allocation = "static"
hardware_config = "examples/hardware.toml"

[codegen.entry_point]
style = "entity"

[codegen.templates]
header = """
library IEEE;
use IEEE.std_logic_1164.all;
use IEEE.numeric_std.all;
"""
footer = """
-- VHDL generated by Brief Compiler
-- Ensure timing constraints are met for your target FPGA
"""