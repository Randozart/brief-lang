[target]
name = "kv260"
backend = "c"
capabilities = ["logic", "hardware_triggers"]

[codegen]
state_allocation = "static"

[codegen.entry_point]
style = "bare_metal"

[memory.banks.low]
start = 0x00000000
size  = 0x80000000  # 2GB
usage = ["kernel"]

[memory.banks.high]
start = 0x800000000
size  = 0x80000000  # 2GB
usage = ["models"]

[memory.sections.kernel]
at = 0x10000000
max_size = 0x01000000 # 16MB

[memory.sections.model_a]
at = 0x800000000
max_size = 0x44C00000 # 1.1GB

[memory.sections.model_b]
at = 0x848000000
max_size = 0x44C00000 # 1.1GB
