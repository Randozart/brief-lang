[target]
name = "hosted-c"
backend = "c"
capabilities = ["logic"]

[codegen]
backend = "c"
extension = "c"
state_allocation = "dynamic"

[codegen.entry_point]
style = "main"

[codegen.templates]
header = """
#include <stdint.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdlib.h>
"""
footer = ""

[syscalls]
SYS_READ = 0
SYS_WRITE = 1
SYS_OPEN = 2
SYS_CLOSE = 3
SYS_MMAP = 9
SYS_MUNMAP = 11
SYS_BRK = 12
SYS_IOCTL = 16
SYS_NANOSLEEP = 35
SYS_GETPID = 39
SYS_EXIT = 60
SYS_FUTEX = 202