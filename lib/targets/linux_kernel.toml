[target]
name = "linux-kernel"
backend = "c"
capabilities = ["logic"]

[codegen]
extension = "c"
state_allocation = "static"

[codegen.entry_point]
style = "module_init"
module_name = "briv_module"

[codegen.templates]
header = """
#include <linux/module.h>
#include <linux/kernel.h>
#include <linux/kthread.h>
#include <linux/delay.h>
"""
footer = """
MODULE_AUTHOR("Briv Compiler");
MODULE_LICENSE("GPL");
"""
