[target]
name = "verilog-fpga"
backend = "verilog"
capabilities = ["logic", "hardware_triggers", "mmio"]

[codegen]
extension = "sv"
state_allocation = "static"
hardware_config = "examples/hardware.toml"

[codegen.entry_point]
style = "module"

[codegen.templates]
header = "module brief_top (input wire clk, input wire rst_n);"