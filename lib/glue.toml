# lib/glue.toml — GLUE Adapter Registry
# 2026-07-22: Protocol-driven language mappings. Each language declares how
# protocol categories (#String, #Int, #Float) map to its native types and
# C ABI types. The compiler derives wrapper types and conversions from these
# protocol mappings — no type_map, c_type_map, or conversions sections needed.
#
# Adding a language = adding a [lang] section. Zero Rust changes.
#
# Template variables:
#   {{bridge_name}}  {{name}}  {{params}}  {{ffi_params}}  {{c_types}}
#   {{args}}         {{args_abi}}  {{return}}  {{c_return}}
#   {{return_expr}}  {{s_param}}  {{s_init}}
#   {{exports}}      {{ffi_decls}}
#
# Special template keys: "fn_template", "ffi_template"
#
# Web target notes:
#   bridge_kind = "wasm_runtime" means the target is a WASM runtime shim
#   calling_convention = "wasm_import" uses wasm_abi fields instead of c_abi
#   The generated output is a JS module that reads WASM linear memory

[python]
types_module = "glue/python/types.bv"
extension = "so"
bridge_kind = "native_module"
calling_convention = "c_abi"
module_init = true

[python.protocols]
"#String" = { native = "str", c_abi = "ctypes.c_void_p" }
"#Int" = { native = "int", c_abi = "ctypes.c_int64" }
"#Float" = { native = "float", c_abi = "ctypes.c_double" }
"#Bool" = { native = "bool", c_abi = "ctypes.c_bool" }
"#Data" = { native = "bytes", c_abi = "ctypes.c_void_p" }
"#Char" = { native = "str", c_abi = "ctypes.c_char" }

[python.templates]
"__init__.py" = """
\"\"\"GLUE bridge for {{bridge_name}} — auto-generated.\"\"\"
import ctypes
import os

_lib = ctypes.CDLL(os.path.join(os.path.dirname(__file__), "bridge.so"))

def _init_state():
    _lib.init_state.argtypes = [ctypes.c_void_p]
    _lib.init_state.restype = None
    import ctypes
    buf = ctypes.create_string_buffer(32)
    state = ctypes.cast(ctypes.pointer(buf), ctypes.c_void_p)
    _lib.init_state(state)
    return state

_STATE = _init_state()

{{exports}}
"""
"fn_template" = """def {{name}}({{params}}):
    _lib.{{name}}.argtypes = [{{c_types}}]
    _lib.{{name}}.restype = {{c_return}}
    return _lib.{{name}}({{s_param}}{{args_abi}})
"""

[node]
types_module = "glue/node/types.bv"
extension = "mjs"
bridge_kind = "esm_module"
calling_convention = "c_abi"

[node.protocols]
"#String" = { native = "string", c_abi = "cstring" }
"#Int" = { native = "bigint", c_abi = "i64" }
"#Float" = { native = "number", c_abi = "double" }
"#Bool" = { native = "boolean", c_abi = "bool" }
"#Data" = { native = "Uint8Array", c_abi = "cstring" }
"#Char" = { native = "string", c_abi = "i32" }

[node.templates]
"index.mjs" = """
// GLUE bridge for {{bridge_name}} — auto-generated.
import { createRequire } from 'module';
const require = createRequire(import.meta.url);
const ffi = require('ffi-napi');

const lib = ffi.Library('./bridge.so', {
    init_state: ['void', ['pointer']],
    {{ffi_decls}}
});

let _state = null;

function init_state() {
    const buf = Buffer.alloc(32);
    _state = buf;
    lib.init_state(buf);
}

init_state();

{{exports}}
"""
"fn_template" = """
export function {{name}}({{params}}) {
    return lib.{{name}}({{s_param}}{{args_abi}});
}
"""
"ffi_template" = """{{name}}: [{{c_return}}, [{{s_param}}{{c_types}}]],"""

[web]
types_module = "glue/web/types.bv"
extension = "mjs"
bridge_kind = "wasm_runtime"
calling_convention = "wasm_import"

[web.protocols]
"#String" = { native = "string", wasm_abi = "i32" }
"#Int" = { native = "number", wasm_abi = "i32" }
"#Float" = { native = "number", wasm_abi = "f64" }
"#Bool" = { native = "boolean", wasm_abi = "i32" }
"#Element" = { native = "Element", wasm_abi = "i32" }
"#CanvasContext" = { native = "WebGLRenderingContext | GPUDevice", wasm_abi = "i32" }

[web.templates]
"dom-shim.mjs" = """
// dom-shim.mjs — Auto-generated GLUE web runtime for {{bridge_name}}
// Reads WASM linear memory at known state offsets. Called by the WASM module
// via __web_flush_state import at each transaction commit point.

export class WasmDomRuntime {
  constructor(wasmBytes) {
    this._handles = [null];
    this._bindingTable = [];
    this._init(wasmBytes);
  }

  async _init(wasmBytes) {
    const wasm = await WebAssembly.instantiate(wasmBytes, {
      env: this._buildImports(),
    });
    this._instance = wasm.instance;
    this._memory = wasm.instance.exports.memory;
    this._loadStateLayout();
  }

  _buildImports() {
    return {
      __web_flush_state: (updatesPtr, count) => {
        this._applyFlush(updatesPtr, count);
      },
    };
  }

  _loadStateLayout() {
    const layoutPtr = this._instance.exports.state_layout();
    const mem = new DataView(this._memory.buffer);
    // ... layout table read at runtime ...
  }

  _applyFlush(updatesPtr, count) {
    const mem = new DataView(this._memory.buffer);
    let off = updatesPtr;
    for (let i = 0; i < count; i++) {
      const handle = mem.getUint32(off, true); off += 4;
      const valPtr = mem.getUint32(off, true); off += 4;
      const valLen = mem.getUint32(off, true); off += 4;
      const binding = this._bindingTable[handle];
      if (binding) {
        const value = valLen > 0
          ? new TextDecoder().decode(new Uint8Array(this._memory.buffer, valPtr, valLen))
          : null;
        binding.applyFn(value);
      }
    }
  }
}

export async function createApp(wasmBytes) {
  const runtime = new WasmDomRuntime(wasmBytes);
  return runtime._instance.exports;
}
"""

[rust]
types_module = "glue/rust/types.bv"
extension = "rs"
bridge_kind = "extern_c_crate"
calling_convention = "lto"

[rust.protocols]
"#String" = { native = "*mut u8", c_abi = "*mut u8" }
"#Int" = { native = "i64", c_abi = "i64" }
"#Float" = { native = "f64", c_abi = "f64" }
"#Bool" = { native = "bool", c_abi = "bool" }
"#Data" = { native = "*mut u8", c_abi = "*mut u8" }
"#Char" = { native = "i32", c_abi = "i32" }

[rust.templates]
"Cargo.toml" = """
[package]
name = "{{bridge_name}}"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
"""

"build.rs" = """
fn main() {
    println!("cargo:rustc-link-search={}", std::env::var("OUT_DIR").unwrap());
    println!("cargo:rustc-link-lib={{bridge_name}}");
}
"""

"src/lib.rs" = """
// GLUE bridge for {{bridge_name}} — auto-generated.
#![allow(dead_code)]

mod ffi;
use std::ffi::c_void;

static mut STATE: *mut c_void = std::ptr::null_mut();

fn init_state() {
    unsafe {
        let layout = std::alloc::Layout::from_size_align(32, 8).unwrap();
        let buf = std::alloc::alloc_zeroed(layout) as *mut c_void;
        ffi::init_state(buf);
        STATE = buf;
    }
}

{{exports}}
"""

"src/ffi.rs" = """
// FFI declarations — auto-generated.
#![allow(dead_code)]
use std::ffi::c_void;

extern "C" {
    {{s_init}}
    {{ffi_decls}}
}
"""
"fn_template" = """pub fn {{name}}({{params}}) -> {{return}} { unsafe {
    let result_abi = ffi::{{name}}(STATE, {{args_abi}});
    {{return_expr}}
} }
"""
"ffi_template" = """    pub fn {{name}}(state: *mut std::ffi::c_void, {{ffi_params}}) -> {{c_return}};"""
