# Standard I/O Bindings
# Provides console input/output operations

# ==================================================
# __input - Native implementation
# ==================================================
[[functions]]
name = "__input"
location = "briv_ffi_native::__input"
target = "native"
description = "Read line from stdin"

[functions.input]

[functions.output.success]
result = "String"

[functions.output.error]
type = "IoError"
code = "Int"
message = "String"

# ==================================================
# __input - WASM implementation
# ==================================================
[[functions]]
name = "__input"
location = "__input"
target = "wasm"
mapper = "wasm"
description = "Read line from stdin (WASM)"
wasm_impl = """function __input() {
    return prompt('Input:') || '';
}"""

[functions.input]
[functions.output.success]
result = "String"
[functions.output.error]
type = "IoError"
code = "Int"
message = "String"