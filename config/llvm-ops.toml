# LLVM Operation Config
# Maps (operation, primitive, bytes) → LLVM IR template.
# %v = result register, %a = first arg, %b = second, %c = third

[op.Add.Int]
1 = "add nsw i8 %a, %b"
2 = "add nsw i16 %a, %b"
4 = "add nsw i32 %a, %b"
8 = "add nsw i64 %a, %b"

[op.Add.Float]
4 = "fadd float %a, %b"
8 = "fadd double %a, %b"

[op.Sub.Int]
1 = "sub nsw i8 %a, %b"
2 = "sub nsw i16 %a, %b"
4 = "sub nsw i32 %a, %b"
8 = "sub nsw i64 %a, %b"

[op.Sub.Float]
4 = "fsub float %a, %b"
8 = "fsub double %a, %b"

[op.Mul.Int]
1 = "mul nsw i8 %a, %b"
2 = "mul nsw i16 %a, %b"
4 = "mul nsw i32 %a, %b"
8 = "mul nsw i64 %a, %b"

[op.Mul.Float]
4 = "fmul float %a, %b"
8 = "fmul double %a, %b"

[op.Div.Int]
1 = "sdiv i8 %a, %b"
2 = "sdiv i16 %a, %b"
4 = "sdiv i32 %a, %b"
8 = "sdiv i64 %a, %b"

[op.Div.Float]
4 = "fdiv float %a, %b"
8 = "fdiv double %a, %b"

[op.Rem.Int]
1 = "srem i8 %a, %b"
2 = "srem i16 %a, %b"
4 = "srem i32 %a, %b"
8 = "srem i64 %a, %b"

[op.Eq.Int]
1 = "icmp eq i8 %a, %b"
2 = "icmp eq i16 %a, %b"
4 = "icmp eq i32 %a, %b"
8 = "icmp eq i64 %a, %b"

[op.Eq.Float]
4 = "fcmp oeq float %a, %b"
8 = "fcmp oeq double %a, %b"

[op.Eq.Bool]
1 = "icmp eq i8 %a, %b"

[op.Eq.Char]
4 = "icmp eq i32 %a, %b"

[op.Neq.Int]
1 = "icmp ne i8 %a, %b"
2 = "icmp ne i16 %a, %b"
4 = "icmp ne i32 %a, %b"
8 = "icmp ne i64 %a, %b"

[op.Neq.Float]
4 = "fcmp une float %a, %b"
8 = "fcmp une double %a, %b"

[op.Neq.Bool]
1 = "icmp ne i8 %a, %b"

[op.Neq.Char]
4 = "icmp ne i32 %a, %b"

[op.Lt.Int]
1 = "icmp slt i8 %a, %b"
2 = "icmp slt i16 %a, %b"
4 = "icmp slt i32 %a, %b"
8 = "icmp slt i64 %a, %b"

[op.Lt.Float]
4 = "fcmp olt float %a, %b"
8 = "fcmp olt double %a, %b"

[op.Gt.Int]
1 = "icmp sgt i8 %a, %b"
2 = "icmp sgt i16 %a, %b"
4 = "icmp sgt i32 %a, %b"
8 = "icmp sgt i64 %a, %b"

[op.Gt.Float]
4 = "fcmp ogt float %a, %b"
8 = "fcmp ogt double %a, %b"

[op.Le.Int]
1 = "icmp sle i8 %a, %b"
2 = "icmp sle i16 %a, %b"
4 = "icmp sle i32 %a, %b"
8 = "icmp sle i64 %a, %b"

[op.Le.Float]
4 = "fcmp ole float %a, %b"
8 = "fcmp ole double %a, %b"

[op.Ge.Int]
1 = "icmp sge i8 %a, %b"
2 = "icmp sge i16 %a, %b"
4 = "icmp sge i32 %a, %b"
8 = "icmp sge i64 %a, %b"

[op.Ge.Float]
4 = "fcmp oge float %a, %b"
8 = "fcmp oge double %a, %b"

[op.Neg.Int]
1 = "sub i8 0, %a"
2 = "sub i16 0, %a"
4 = "sub i32 0, %a"
8 = "sub i64 0, %a"

[op.Neg.Float]
4 = "fneg float %a"
8 = "fneg double %a"

[op.Sqrt.Float]
4 = "call float @llvm.sqrt.f32(float %a)"
8 = "call double @llvm.sqrt.f64(double %a)"

[op.Sin.Float]
4 = "call float @llvm.sin.f32(float %a)"
8 = "call double @llvm.sin.f64(double %a)"

[op.Cos.Float]
4 = "call float @llvm.cos.f32(float %a)"
8 = "call double @llvm.cos.f64(double %a)"

[op.Fabs.Float]
4 = "call float @llvm.fabs.f32(float %a)"
8 = "call double @llvm.fabs.f64(double %a)"

[op.Ceil.Float]
4 = "call float @llvm.ceil.f32(float %a)"
8 = "call double @llvm.ceil.f64(double %a)"

[op.Floor.Float]
4 = "call float @llvm.floor.f32(float %a)"
8 = "call double @llvm.floor.f64(double %a)"

[op.Pow.Float]
4 = "call float @llvm.pow.f32(float %a, float %b)"
8 = "call double @llvm.pow.f64(double %a, double %b)"

[op.Print.Int]
8 = "call i32 (ptr, ...) @printf(ptr @.fmt_int, i64 %a)"

[op.Print.Float]
8 = "call i32 (ptr, ...) @printf(ptr @.fmt_float, double %a)"

[op.Print.String]
8 = "call i32 (ptr, ...) @printf(ptr @.fmt_str, ptr %a)"

[op.Malloc]
8 = "call ptr @malloc(i64 %a)"

[op.Free]
8 = "call void @free(ptr %a)"

[op.Memcpy]
8 = "call ptr @memcpy(ptr %a, ptr %b, i64 %c)"

[op.Memset]
8 = "call ptr @memset(ptr %a, i64 %b, i64 %c)"
