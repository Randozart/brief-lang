# ── Encoding Config ──────────────────────────────────────────────────────
# 2026-07-18: All encoding definitions. No hardcoded PascalCase table in the
# compiler — every encoding is resolved through this file.
#
# char_width:
#   0 = variable-width encoding (Index# delegates to stdlib or runtime scan)
#   1+ = fixed-width encoding (Index# emits direct GEP, O(1))
#
# ops.index_at : stdlib function for Index#(s, i) -> char at byte offset
# ops.char_len : stdlib function for Length#(s) -> character count
# Ops are optional — when absent, the backend falls back to byte-level ops.
# Fixed-width encodings (char_width > 0) never need ops — compiler emits GEP.

["encoding.UTF-8"]
char_width = 0
ops.index_at = "std.encoding.UTF8.index_at"
ops.char_len = "std.encoding.UTF8.char_count"

["encoding.ASCII"]
char_width = 1

["encoding.Latin1"]
char_width = 1

["encoding.UTF-16"]
char_width = 0
ops.index_at = "std.encoding.UTF16.index_at"
ops.char_len = "std.encoding.UTF16.char_count"

["encoding.UTF-32"]
char_width = 4

["encoding.shift_jis"]
char_width = 0
ops.index_at = "std.encoding.shift_jis.index_at"
ops.char_len = "std.encoding.shift_jis.char_count"

["encoding.windows_1252"]
char_width = 1

["encoding.iso_8859_15"]
char_width = 1

["encoding.utf_16le"]
char_width = 0

["encoding.utf_16be"]
char_width = 0

["encoding.euc_jp"]
char_width = 0

["encoding.gb2312"]
char_width = 0

["encoding.koi8_r"]
char_width = 1
