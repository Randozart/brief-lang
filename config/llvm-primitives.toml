# LLVM Primitive Type Config
# Maps (primitive, bytes) → LLVM type string.
# Read at compile time — no Rust hardcoded tables.

[primitive.Int]
1 = "i8"
2 = "i16"
4 = "i32"
8 = "i64"

[primitive.UInt]
1 = "i8"
2 = "i16"
4 = "i32"
8 = "i64"

[primitive.Float]
2 = "half"
4 = "float"
8 = "double"

[primitive.Bool]
1 = "i8"

[primitive.Char]
4 = "i32"

[primitive.String]
8 = "ptr"

[primitive.Data]
8 = "ptr"
